services:
  server:
    build:
      context: .
    ports:
      - 9000:80
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://app:app@db:3306/movies_app?serverVersion=8.4&charset=utf8mb4
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/var/www/html/public/uploads

  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_DATABASE: movies_app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  uploads: